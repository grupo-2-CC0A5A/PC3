name: behave

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - run: |
        mkdir -p reports

    - run: |
        coverage run --source=models -m behave --format pretty --format json -o reports/behave-report.json
        coverage xml -o reports/coverage.xml
        coverage html -d reports/coverage_html
      continue-on-error: false
    
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: behave-test-results-${{ matrix.python-version }}
        path: reports/
        retention-days: 30
    
    - if: always()
      run: |
        echo "## Behave test results - python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        mkdir -p reports
        behave --dry-run --no-summary > reports/behave-dryrun.txt || true
        head -n 200 reports/behave-dryrun.txt >> $GITHUB_STEP_SUMMARY || true
